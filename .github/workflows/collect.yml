name: Captura de publicaciones de X

# Una sola captura, a mano desde la pestaña Actions (botón "Run workflow").
# La captura automática cada 30 minutos la hace "Captura continua" (captura-continua.yml).
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: captura-x-manual
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modelo/requirements.txt

      - name: Instalar el modelo
        run: pip install -r modelo/requirements.txt

      - name: Probar el recolector y el modelo
        run: |
          node --test collector/*.test.mjs tests/*.test.mjs
          python -m unittest modelo.test_modelo

      - name: Capturar, clasificar y publicar
        env:
          # La API key vive solo como secreto del repositorio; nunca en el código.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_MAX_PAGES: ${{ vars.X_MAX_PAGES }}
          X_RETENCION_DIAS: ${{ vars.X_RETENCION_DIAS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/captura.sh
