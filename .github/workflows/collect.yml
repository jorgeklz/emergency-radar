name: Captura de publicaciones de X

# Corre cada 30 minutos (GitHub puede retrasar las ejecuciones programadas)
# y también a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: captura-x
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modelo/requirements.txt

      - name: Instalar el modelo
        run: pip install -r modelo/requirements.txt

      - name: Probar el recolector y el modelo
        run: |
          node --test collector/*.test.mjs tests/*.test.mjs
          python -m unittest modelo.test_modelo

      - name: Capturar publicaciones
        env:
          # La API key vive solo como secreto del repositorio; nunca en el código.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_QUERY: ${{ vars.X_QUERY }}
          X_MAX_PAGES: ${{ vars.X_MAX_PAGES }}
          X_RETENCION_DIAS: ${{ vars.X_RETENCION_DIAS }}
        run: node collector/x-collector.mjs

      # Grafo kNN sobre similitud LSI (Parraga-Alava et al., 2026): marca cada
      # publicación como emergencia o no emergencia según sus vecinos del corpus.
      - name: Clasificar con el modelo
        run: python -m modelo.clasificar

      - name: Guardar datos
        id: guardar
        run: |
          if git diff --quiet -- data/posts.json; then
            echo "Sin cambios en los datos."
            echo "cambios=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git commit -m "Datos: captura de X $(date -u +'%Y-%m-%d %H:%M') UTC"
          for intento in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((intento * 5))
          done
          echo "cambios=true" >> "$GITHUB_OUTPUT"

      # Los push hechos con GITHUB_TOKEN no siempre disparan la publicación de Pages,
      # así que se solicita explícitamente.
      - name: Republicar GitHub Pages
        if: steps.guardar.outputs.cambios == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
