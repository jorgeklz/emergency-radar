name: Captura diaria de X

# Una captura al día para reducir el consumo de la API de X. Consulta todos los grupos de
# lugares (cada uno pide solo lo nuevo desde su última captura, hasta X_MAX_PAGES páginas).
# Hora: 07:46 en Ecuador (12:46 UTC). Para cambiarla, edita el cron de abajo (hora UTC).
# También se puede lanzar a mano: Actions > "Captura diaria de X" > Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "46 12 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: captura-continua
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modelo/requirements.txt

      - name: Instalar el modelo
        run: pip install -r modelo/requirements.txt

      - name: Probar el recolector y el modelo
        run: |
          node --test collector/*.test.mjs tests/*.test.mjs
          python -m unittest modelo.test_modelo

      - name: Capturar una vez (todos los grupos de lugares)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          # Un día de posts puede superar 200 por grupo: hasta 5 páginas de 100 por grupo.
          X_MAX_PAGES: ${{ vars.X_MAX_PAGES || '5' }}
          X_RETENCION_DIAS: ${{ vars.X_RETENCION_DIAS }}
          X_TODOS_LOS_GRUPOS: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/captura.sh
